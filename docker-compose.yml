version: "3.9"

services:
  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=auth-db
      - DB_USER=authuser
      - DB_PASSWORD=authpassword
      - DB_NAME=authdbname
      - DB_PORT=5432
    depends_on:
      - auth-db

  todo:
    build:
      context: ./todo-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=todo-db
      - DB_USER=todouser
      - DB_PASSWORD=todopassword
      - DB_NAME=tododbname
      - DB_PORT=5432
      - REDIS_ADDR=redis:6379
      - AUTH_URL=http://auth:8080
    depends_on:
      - todo-db
      - redis
      - auth

  auth-db:
    image: postgres:15
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
      POSTGRES_DB: authdbname
    ports:
      - "9002:5432"   # если хочешь доступ с хоста через 9002
    volumes:
      - auth_data:/var/lib/postgresql/data

  todo-db:
    image: postgres:15
    environment:
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopassword
      POSTGRES_DB: tododbname
    ports:
      - "9001:5432"   # если хочешь доступ с хоста через 9001
    volumes:
      - todo_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  auth_data:
  todo_data:
